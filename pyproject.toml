[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "markdown-cv"
version = "0.1.1"
description = "Build polished, paginated CV PDFs from editable Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Andre Lustosa" }]
keywords = ["cv", "resume", "markdown", "pdf", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "markdown-it-py>=4.0,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
markdown-cv = "markdown_cv.cli:main"

[project.urls]
Homepage = "https://github.com/andre-motta/markdown_cv"
Repository = "https://github.com/andre-motta/markdown_cv"
Issues = "https://github.com/andre-motta/markdown_cv/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_cv"]

[tool.hatch.build]
include = [
  "src/markdown_cv/**/*.py",
  "src/markdown_cv/styles/*.css",
]
